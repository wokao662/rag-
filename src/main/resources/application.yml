spring:
  application:
    name: personalized-learning-rag
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:learning_app}
    username: ${POSTGRES_USER:learning_app}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-response: true
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ${spring.application.name}

app:
  governance:
    # 审核闸门。首批人工审核已完成（11 条 approved + 2 条背景知识 rejected+paused，0 条 draft），
    # 开启不再会把推荐过滤成全空。本地仍保持 false 是有意的：那 2 条由 paused 与此开关无关地永久
    # 挡下，开不开推荐结果相同。关闭时仍然拦两类：无源档案（无法溯源）与被真实反馈证伪（足够多人
    # 试过且有用率过低）的策略；曝光计数、社区分与合成总分照常累计。上线公网时改 true，让“只推
    # approved + 曝光人数上限”两条生效。
    review-gate: ${GOVERNANCE_REVIEW_GATE:false}
  logs:
    # 模型调用日志保留天数。input_json 存的是送给模型的输入原文（extract 任务里就是用户逐字说过的话），
    # 是全系统最大的隐私暴露面，不能无限期留着。写入前已脱敏，但姓名学校这类无固定格式的信息
    # 脱不掉，只能靠保留期兜住。不按 status 区分：fallback / failed 行是模型一最有价值的难样本，
    # 同样保留到期。设为 0 或负数则关闭自动清理（只建议本地排查时临时使用）。
    retention-days: ${LOG_RETENTION_DAYS:365}
    # 每天 03:30 清理一次。启动时也会清一次，部署即生效。
    purge-cron: "0 30 3 * * *"
