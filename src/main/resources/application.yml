spring:
  application:
    name: personalized-learning-rag
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:learning_app}
    username: ${POSTGRES_USER:learning_app}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-response: true
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ${spring.application.name}

app:
  governance:
    # 审核闸门。13 个策略档案目前全是 draft，开启会把推荐过滤成全空，因此人工审核完成前
    # 保持 false。关闭时仍然拦两类：无源档案（无法溯源）与被真实反馈证伪（足够多人试过且有用率
    # 过低）的策略；曝光计数、社区分与合成总分照常累计。审核完成、把通过的策略置为 approved 后改 true。
    review-gate: ${GOVERNANCE_REVIEW_GATE:false}
