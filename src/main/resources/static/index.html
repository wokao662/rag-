<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习策略推荐</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>学习策略推荐</h1>
    <div class="user-bar">
        <label for="externalId">用户标识</label>
        <input id="externalId" type="text" maxlength="128" placeholder="例如 web-user-001">
        <button id="loadUser">加载</button>
        <button id="newConversation" disabled>新会话</button>
    </div>
</header>
<main>
    <aside id="sidebar">
        <h2>历史会话</h2>
        <ul id="conversationList"></ul>
    </aside>
    <section id="chat">
        <div id="messages"></div>
        <form id="composer">
            <textarea id="input" rows="2" placeholder="描述你的学习目标、困难和时间约束……" disabled></textarea>
            <button type="submit" id="send" disabled>发送</button>
        </form>
        <div id="status"></div>
    </section>
    <aside id="panel">
        <h2>当前画像</h2>
        <dl id="profile"></dl>
    </aside>
</main>
<script src="app.js"></script>
</body>
</html>
